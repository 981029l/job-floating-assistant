<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50/40 to-slate-200 text-slate-800 antialiased p-8 flex items-center justify-center min-h-screen">

  <div class="flex flex-col items-center">
    <!-- 手机机身容器 (高保真 3D 悬浮投影) -->
    <div class="w-[390px] h-[810px] bg-slate-900 rounded-[52px] p-3.5 shadow-[0_25px_60px_-15px_rgba(22,119,255,0.25)] border-[5px] border-slate-700/80 flex flex-col relative">
      
      <!-- 顶部灵动岛 / 前置挖孔 -->
      <div class="absolute top-4 left-1/2 -translate-x-1/2 w-28 h-4 bg-black rounded-full z-30 flex items-center justify-center">
        <div class="w-2.5 h-2.5 bg-slate-800 rounded-full border border-slate-700/60 ml-4"></div>
      </div>

      <!-- 手机屏幕内容 -->
      <div class="w-full h-full bg-[#F5F7FA] rounded-[42px] overflow-hidden flex flex-col relative font-sans">
        
        <!-- 状态栏 -->
        <div class="h-9 bg-[#1677FF] text-white text-[11px] px-7 flex items-center justify-between z-20 font-medium">
          <span>09:41</span>
          <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M17.778 8.222c-4.296-4.296-11.26-4.296-15.556 0A1 1 0 01.808 6.808c5.076-5.077 13.308-5.077 18.384 0a1 1 0 01-1.414 1.414zM14.95 11.05a7 7 0 00-9.9 0 1 1 0 01-1.414-1.414 9 9 0 0112.728 0 1 1 0 01-1.414 1.414zM12.12 13.88a3 3 0 00-4.242 0 1 1 0 01-1.415-1.415 5 5 0 017.072 0 1 1 0 01-1.415 1.415zM9 16a1 1 0 011-1h.01a1 1 0 110 2H10a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
            <span>100%</span>
          </div>
        </div>

        <!-- 主界面主体内容区 (Material 3 规范) -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3.5 no-scrollbar pb-10">
          
          <!-- 1. Hero 头部卡片 -->
          <div class="bg-gradient-to-r from-[#1677FF] via-[#2F80ED] to-[#36CFC9] text-white p-4 rounded-2xl shadow-lg shadow-blue-500/20 flex items-center gap-3.5">
            <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center shrink-0 border border-white/25">
              <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12c0 3.31 1.61 6.24 4.1 8.04V21c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-.8c.61.18 1.25.3 1.9.3.65 0 1.29-.12 1.9-.3V21c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-.96c2.49-1.8 4.1-4.73 4.1-8.04 0-5.52-4.48-10-10-10zm-3 13c-.83 0-1.5-.67-1.5-1.5S8.17 12 9 12s1.5.67 1.5 1.5S9.83 15 9 15zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 12 15 12s1.5.67 1.5 1.5S15.83 15 15 15z"/>
              </svg>
            </div>
            <div>
              <h2 class="text-base font-bold tracking-tight">AI 求职悬浮助手</h2>
              <p class="text-[11px] text-blue-100/90 mt-0.5 leading-snug">屏幕秒级提取 JD · 纯单机直连 · 无需服务器</p>
            </div>
          </div>

          <!-- 2. 权限与悬浮开关 -->
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100/80 space-y-3">
            <div class="flex items-center gap-2 border-b border-slate-100 pb-2.5">
              <svg class="w-4 h-4 text-[#1677FF]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
              <span class="text-xs font-bold text-slate-800">权限与悬浮开关</span>
            </div>

            <!-- 悬浮窗权限 -->
            <div class="flex items-center justify-between text-xs">
              <div>
                <p class="font-semibold text-slate-800">1. 悬浮窗权限</p>
                <div class="flex items-center gap-1 text-[11px] text-[#52C41A] font-medium mt-0.5">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                  <span>已开启 (可正常弹出悬浮球)</span>
                </div>
              </div>
              <span class="bg-[#F6FFED] text-[#52C41A] border border-[#B7EB8F] px-2.5 py-1 rounded-lg text-[11px] font-bold">已授权</span>
            </div>

            <!-- 无障碍读屏 -->
            <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-50">
              <div>
                <p class="font-semibold text-slate-800">2. 无障碍读屏服务</p>
                <div class="flex items-center gap-1 text-[11px] text-[#52C41A] font-medium mt-0.5">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                  <span>已开启 (可在 BOSS 秒级读屏)</span>
                </div>
              </div>
              <span class="bg-[#F6FFED] text-[#52C41A] border border-[#B7EB8F] px-2.5 py-1 rounded-lg text-[11px] font-bold">已开启</span>
            </div>

            <!-- 开启屏幕悬浮球主开关 -->
            <button class="w-full bg-[#1677FF] hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md shadow-blue-500/20 active:scale-[0.98] transition-all">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <span>开启屏幕悬浮球</span>
            </button>
          </div>

          <!-- 3. 大模型 API 设置 -->
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100/80 space-y-2.5 text-xs">
            <div class="flex items-center gap-2 border-b border-slate-100 pb-2.5">
              <svg class="w-4 h-4 text-[#1677FF]" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
              <span class="font-bold text-slate-800">大模型 API 设置</span>
            </div>

            <div>
              <label class="text-slate-500 text-[11px] font-medium">DeepSeek API Key</label>
              <input type="password" value="sk-d7890aef********************" class="w-full mt-1 px-3 py-1.5 border border-slate-200 rounded-lg text-slate-800 font-mono text-xs bg-slate-50/70" readonly>
            </div>

            <!-- 模型选择与刷新按钮 -->
            <div class="flex items-center gap-2">
              <div class="flex-1">
                <label class="text-slate-500 text-[11px] font-medium">当前选择模型</label>
                <input type="text" value="deepseek-chat" class="w-full mt-1 px-3 py-1.5 border border-slate-200 rounded-lg text-slate-800 font-semibold text-xs bg-slate-50/70" readonly>
              </div>
              <button class="mt-4 bg-[#52C41A] hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1 shadow-sm shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>获取模型</span>
              </button>
            </div>

            <!-- 快捷标签 Chips -->
            <div class="flex gap-1.5 pt-1">
              <span class="bg-blue-50 text-blue-600 px-2.5 py-0.5 rounded-full text-[10px] font-bold border border-blue-200 shadow-2xs">deepseek-chat</span>
              <span class="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full text-[10px]">deepseek-reasoner</span>
              <span class="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full text-[10px]">qwen-turbo</span>
            </div>
          </div>

          <!-- 4. 简历管理模块 -->
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100/80 space-y-2.5 text-xs">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-[#1677FF]" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                <span class="font-bold text-slate-800">我的简历内容</span>
              </div>
              <span class="text-[11px] text-blue-600 font-medium">恢复预设</span>
            </div>

            <!-- 上传简历文件按钮 (Purple) -->
            <button class="w-full bg-[#722ED1] hover:bg-purple-700 text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
              <span>选择并上传简历文件 (PDF / Word / TXT)</span>
            </button>

            <!-- 简历内容文本域预览 -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5 text-[11px] text-slate-600 leading-relaxed font-mono h-24 overflow-y-auto no-scrollbar">
              吕宽友 | 7年前端研发经验 | 期望城市：深圳 | 期望薪资：15-20K<br/>
              【核心优势】精通 Vue3+TS+Vite、深度主导 AI 应用落地（SSE流式打字机交互、语音合成TTS、知识库切片双向高亮溯源）...
            </div>
          </div>

        </div>

        <!-- 底部主控条 -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-400 rounded-full"></div>
      </div>
    </div>
  </div>

</body>
</html>
