name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.3.2.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.2
          name: "AI求职悬浮助手 v1.3.2 (全链路注入8维沟通礼仪规范/尊称开场与多轮自适应/纯净正式版APK)"
          body: |
            AI 求职悬浮助手 v1.3.2 人文礼貌与情商重大升级：
            1. 全场景接入【8 维沟通礼仪与开场规范】：
               - 首次主动破冰：原则上使用「您好」礼貌开场，随后秒入核心硬核优势，兼具教养与技术深度；
               - 区分首轮与多轮：已建立聊天的场景严禁机械重复「您好」，自然承接上一轮对话；
               - 回答具体问题：优先直接回答 HR 提出的问题，不画蛇添足；
               - 去书面化与网购腔：杜绝「贵司」「贵公司」等公文腔，禁用「亲/老板/大佬」等随意词汇，极度贴合真实优秀求职者语气。
            2. 纯净生产版发布（JobAssistant-v1.3.2.apk），继承固化签名，覆盖安装数据 100% 完整保留。
          files: release_apk/JobAssistant-v1.3.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

