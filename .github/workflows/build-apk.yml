name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 验证岗位匹配并编译 APK
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.4.3.apk

      - name: 校验 APK 版本与签名
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release_apk/JobAssistant-v1.4.3.apk
          "$BUILD_TOOLS/aapt" dump badging release_apk/JobAssistant-v1.4.3.apk > apk-badging.txt
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('version.json').read_text())
          gradle = pathlib.Path('app/build.gradle.kts').read_text()
          badging = pathlib.Path('apk-badging.txt').read_text()
          assert re.search(r'versionCode\s*=\s*' + str(version['versionCode']) + r'\b', gradle)
          assert 'versionName = "' + version['versionName'] + '"' in gradle
          assert "name='com.assistant.job'" in badging
          assert "versionCode='" + str(version['versionCode']) + "'" in badging
          assert "versionName='" + version['versionName'] + "'" in badging
          print(badging.splitlines()[0])
          PY
          cd release_apk
          sha256sum JobAssistant-v1.4.3.apk > SHA256SUMS.txt

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*
          retention-days: 30

      - name: 保存单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.3
          target_commitish: ${{ github.sha }}
          name: "AI求职助手 v1.4.3 · 可复制的错误诊断报告"
          body: |
            生成失败时可展开详情并一键复制，便于直接反馈定位问题。

            - 悬浮窗提供「查看错误详情」「复制错误详情」。
            - AI 设置集中保留最近一次生成错误，支持查看、复制与清除，重启后仍可读取。
            - 记录失败阶段、实际耗时、超时配置、模型、HTTP 状态、请求 ID、接口错误摘要及异常链。
            - 敏感信息脱敏；不记录完整 JD、简历、聊天、提示词或模型响应正文，不自动上传诊断报告。
            - 沿用原签名，可覆盖安装并保留档案与配置。

            旧截图中的 timeout 无法恢复详细原因；新版会在下一次生成失败时记录报告。
          files: release_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
