name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.3.8.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.8
          name: "AI求职助手 v1.3.8 (终结虚构痛点/清单对照加分项突围/简历对齐精准推销)"
          body: |
            AI 求职助手 v1.3.8 重大更新说明：
            1. 彻底终结虚构痛点与假大空玄学：全面转向「采购清单对照 + 加分项突围 + 简历对齐自荐推销」商业本质；
            2. 落地【显式三要素核对流水线】：拆解日常职责、准入门槛与加分偏好项，以加分项为差异化第一推销王牌；
            3. 双全新风格上线：【核心职责对齐型】（全面胜任即插即用）与【加分优势突围型】（精准命中加分偏好压倒性突围）；
            4. 正式产物 APK 名：JobAssistant-v1.3.8.apk（继承持久签名，无缝覆盖升级）。
          files: release_apk/JobAssistant-v1.3.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
