name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 验证岗位匹配并编译 APK
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.4.8.apk

      - name: 校验 APK 版本与签名
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release_apk/JobAssistant-v1.4.8.apk
          "$BUILD_TOOLS/aapt" dump badging release_apk/JobAssistant-v1.4.8.apk > apk-badging.txt
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('version.json').read_text())
          gradle = pathlib.Path('app/build.gradle.kts').read_text()
          badging = pathlib.Path('apk-badging.txt').read_text()
          assert re.search(r'versionCode\s*=\s*' + str(version['versionCode']) + r'\b', gradle)
          assert 'versionName = "' + version['versionName'] + '"' in gradle
          assert "name='com.assistant.job'" in badging
          assert "versionCode='" + str(version['versionCode']) + "'" in badging
          assert "versionName='" + version['versionName'] + "'" in badging
          print(badging.splitlines()[0])
          PY
          cd release_apk
          sha256sum JobAssistant-v1.4.8.apk > SHA256SUMS.txt

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*
          retention-days: 30

      - name: 保存单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.8
          target_commitish: ${{ github.sha }}
          name: "AI求职助手 v1.4.8 · 修复首次破冰识别职位详情与匹配标点大小写误判"
          body: |
            修复首次破冰识别 BOSS 直聘详情页职位介绍与岗位逐项匹配引用校验标点误判：

            - **修复首次破冰识别 BOSS 直聘详情页**：无障碍分段标记补充「职位详情/岗位详情/职位介绍/岗位介绍/职责描述/工作要求」，彻底解决首次进入 JD 详情页时因标题识别不全导致读取不到屏幕岗位 JD 的缺陷。
            - **修复岗位匹配第一阶段引用校验标点与大小写误判**：优化 `JobMatch.compact()` 规范化算法，统一全角与半角标点映射并转 ASCII 小写比对，彻底杜绝模型返回逗号、括号或大小写不一致触发「岗位匹配引用了简历中不存在的内容」校验误判报错。
            - 补齐相关单元测试；沿用统一 `debug.keystore` 持久签名，支持无缝覆盖安装。
          files: release_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
