name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.3.9.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.9
          name: "AI求职助手 v1.3.9 (五大终极推销心智规则/语法从属位/跨界上限为二/王牌主动出击)"
          body: |
            AI 求职助手 v1.3.9 重大更新说明：
            1. 落地五大终极推销心智规则（通过 grill-me 压力拷问验证）：主战场基石层(60%) + 硬底盘骨干层(30%) + 点缀层语法从属位(10%)；
            2. 彻底根除加分项反客为主：加分项强制锁定在第二句末尾从属位（“同时具备/也涉及……”），绝对严禁拿边缘加分词当开局主语；
            3. 跨界代表作上限为二法则：允许最多带出 2 个不同领域的代表业务系统展示广度，彻底消灭 3 个以上无脑报菜名大串烧；
            4. 极简 JD 王牌出击机制：未标明具体业务时拿出最复杂商业项目反向吸引；
            5. 正式产物 APK 名：JobAssistant-v1.3.9.apk（继承持久签名，无缝覆盖升级）。
          files: release_apk/JobAssistant-v1.3.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
