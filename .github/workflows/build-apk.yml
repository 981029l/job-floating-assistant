name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.1-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "AI求职悬浮助手 v1.1.1 (三大Tab全盘落地 Google Stitch Bento 高保真规范)"
          body: |
            AI 求职悬浮助手 v1.1.1 重磅发布：三大主界面全部落地 Google Stitch Bento 高保真设计体系！
            1. AI 设置全盘升级：
               - API Key 密码掩码显示切换、一键剪贴板粘贴与清空；
               - 常用 Base URL 预设快速切换芯片（DeepSeek 官方、OpenAI、阿里百炼、OneAPI）；
               - 网络连通性极佳状态卡片（Ping 88ms、已就绪常用模型）；
               - 6种专家破冰风格切换标签（技术硬核攻坚型、直击痛点量化型、业务价值驱动型、诚恳探索交流型、敏捷快速破冰型、高情商共情型）；
               - 动态提示词变量芯片快速插入（{{目标岗位JD}}、{{候选人亮点}}等）；
               - 实时字符计数与防折叠推荐（建议100-130字，超300字警示）；
               - 实时模拟破冰打招呼语弹窗（支持多预设随机体验与一键复制）；
            2. 求职档案与悬浮主控体系深度联动；
            3. 全工程 0 Emojis，全部采用原生 Android XML Vector Drawables 矢量渲染，安装包保持在极小体积 (~17MB)。
          files: release_apk/JobAssistant-v1.1.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

