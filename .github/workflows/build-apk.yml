name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.3-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "AI求职悬浮助手 v1.0.3 (全面升级 Material 原生矢量图标)"
          body: |
            🎉 **AI 求职悬浮助手 v1.0.3 正式发布**：
            1. 💎 **全面替换为 Google Material Design 3 原生矢量图标**：彻底废弃 Emoji 字符，引入 `androidx.compose.material:material-icons-extended`，包含 `Psychology`, `Security`, `CheckCircle`, `Settings`, `UploadFile`, `Refresh` 等全套原生矢量 Icon；
            2. 🎨 **全新独立设计的 Android Adaptive App 图标**；
            3. 🛠️ **全套核心能力**：Android 14 悬浮窗前台服务、穿透无障碍读屏抓取、模型列表在线获取、PDF/Word/TXT 简历一键解析。
          files: release_apk/JobAssistant-v1.0.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

