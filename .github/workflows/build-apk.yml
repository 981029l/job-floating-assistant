name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.5-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "AI求职悬浮助手 v1.0.5 (Material 3 Expressive 旗舰级全新 UI)"
          body: |
            🎉 **AI 求职悬浮助手 v1.0.5 旗舰级全新设计重构发布**：
            1. 🌟 **全面重构为 Material 3 Expressive 旗舰级 UI 架构**：引入三段式底部导航栏（【悬浮主控】、【求职档案】、【AI设置】）；
            2. 🐱 **C1 招手好运猫沉浸顶栏**：集成呼吸光效状态指示（“好运猫待命中 · 绿点呼吸”）；
            3. 📱 **Bento-Grid 触控大卡片系统**：全局悬浮球主开关、核心权限自检、当前运行模型胶囊快捷切换，层级分明；
            4. 📄 **独立求职档案中心**：支持 PDF/Word 文件导入与技能亮点标签化呈现。
          files: release_apk/JobAssistant-v1.0.5-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

