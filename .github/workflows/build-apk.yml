name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 验证岗位匹配并编译 APK
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.5.0.apk

      - name: 校验 APK 版本与签名
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release_apk/JobAssistant-v1.5.0.apk
          "$BUILD_TOOLS/aapt" dump badging release_apk/JobAssistant-v1.5.0.apk > apk-badging.txt
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('version.json').read_text())
          gradle = pathlib.Path('app/build.gradle.kts').read_text()
          badging = pathlib.Path('apk-badging.txt').read_text()
          assert re.search(r'versionCode\s*=\s*' + str(version['versionCode']) + r'\b', gradle)
          assert 'versionName = "' + version['versionName'] + '"' in gradle
          assert "name='com.assistant.job'" in badging
          assert "versionCode='" + str(version['versionCode']) + "'" in badging
          assert "versionName='" + version['versionName'] + "'" in badging
          print(badging.splitlines()[0])
          PY
          cd release_apk
          sha256sum JobAssistant-v1.5.0.apk > SHA256SUMS.txt

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*
          retention-days: 30

      - name: 保存单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          target_commitish: ${{ github.sha }}
          name: "AI求职助手 v1.5.0 · 悬浮窗全新上线聊天记录卡片与防漏读增强"
          body: |
            悬浮窗全新上线「聊天记录 / 对方消息」可视化卡片与底层短消息防漏读升级：

            - **悬浮窗上线专属「聊天记录」卡片**：深入沟通/已读等场景下直观展示抓到的对话记录与对方最新问题，状态徽章清晰标注（`对方已回 · xxx` / `已捕获 · n条` / `未捕获`），告别开盲盒。
            - **支持聊天记录查看/修改/粘贴与一键重生**：点击展开可完整查看历史聊天，支持手动打字编辑或一键【粘贴】补充 HR 提问，点击【应用并重新生成】即刻按新上下文答复。
            - **底层读屏防漏读升级**：彻底解除底层对短消息的盲目过滤，确保「发简历」「期望薪资多少」等 HR 真实短消息 100% 捕获，同时过滤候选人顶栏快捷操作按钮噪音。
            - 补齐相关单元测试；沿用统一 `debug.keystore` 持久签名，支持无缝覆盖安装。
          files: release_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
