name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.1-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "AI求职悬浮助手 v1.0.1 (重要更新)"
          body: |
            🎉 **AI 求职悬浮助手 v1.0.1 重大体验修复更新**：
            1. 修复 Android 14 前台服务特殊类型适配，解决开启悬浮窗无反应的问题；
            2. 重构无障碍读屏与窗口遍历机制，增加屏幕文本缓存与剪贴板兜底粘贴；
            3. 新增【🔄 获取模型列表】功能，一键从 API 拉取全部可用模型；
            4. 新增【📁 上传简历文件】功能，支持一键上传并解析 PDF / Word(.docx) / TXT 格式简历。
          files: release_apk/JobAssistant-v1.0.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

