name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.2-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "AI求职悬浮助手 v1.1.2 (100% 像素级对齐 Google Stitch 高保真规范)"
          body: |
            AI 求职悬浮助手 v1.1.2 正式发布：全盘像素级落地 Google Stitch 设计与交互体系！
            1. 顶部 Hero Banner：
               - 在线绿点动态呼吸状态，版本徽章升级为「Pro v2.4」；
               - 副标全量同步「在线待命中 · 实时匹配岗位需求与破冰话术」。
            2. AI 设置 Tab 像素级精雕细琢：
               - API Key 密码遮蔽、一键粘贴、一键清空；
               - 常用 Base URL 药丸预设快速切换；
               - 连通性状态卡片：动态 Ping 延时展示与「已就绪 8~15 个模型」实时联动；
               - 6 种打招呼破冰风格标签即点即用；
               - 变量快速插入芯片、实时字符数动态监控（超 300 字符橙色预警）；
               - 保存配置按钮瞬态反馈「已保存！引擎生效中」；
               - 模拟打招呼语 Bottom Sheet 弹窗：原生流式打字效果体验与一键复制。
            3. 全工程 0 Emojis，纯原生 XML 矢量 Drawables，安装包保持精简极致 (~17MB)。
          files: release_apk/JobAssistant-v1.1.2-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

