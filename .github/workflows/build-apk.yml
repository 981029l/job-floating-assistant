name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.4-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "AI求职悬浮助手 v1.0.4 (C1 招手好运猫专属换装版)"
          body: |
            🎉 **AI 求职悬浮助手 v1.0.4 正式发布**：
            1. 🐱 **正式采用【方向 C1 · 招手好运猫】专属 IP 图标**：全套适配 Android 桌面启动图标；
            2. 💫 **悬浮球全面视觉升级**：全局悬浮球彻底告别蓝圈文字，直接换装为超萌的圆形【招手好运猫】IP 头像微件；
            3. 💎 **Material 3 原生矢量规范**：保持内部所有界面 0 Emoji，全套官方原生矢量图标；
            4. 🚀 **全功能稳定版**：Android 14 悬浮窗、无障碍穿透读屏、在线获取模型列表、PDF/Word/TXT 简历一键上传解析。
          files: release_apk/JobAssistant-v1.0.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

