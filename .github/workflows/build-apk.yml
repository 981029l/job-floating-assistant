name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.5-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.5
          name: "AI求职悬浮助手 v1.1.5 (底部导航栏平滑横滑动效)"
          body: |
            AI 求职悬浮助手 v1.1.5 体验升级：
            1. 底部导航栏平滑移动切换：
               - 采用 Jetpack Compose 官方 AnimatedContent 实现方向感知平滑横滑动画；
               - 符合 Google Material Design 3 规范中的 Peer Destination Shared Axis X 动效标准；
               - 左右切换自适应方向：向右前进时新视窗从右滑入，向左后退时新视窗从左滑入，搭配 280ms 缓动与透明度过渡；
               - 零手势冲突，完全不影响 AI 设置页等内部组件的横向滚动与卡片交互。
            2. 继承 v1.1.4 全部细节精修：
               - 纯净真实空白档案录入态、移除死数据与生硬当前徽章、修复顶栏状态胶囊排版。
          files: release_apk/JobAssistant-v1.1.5-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

