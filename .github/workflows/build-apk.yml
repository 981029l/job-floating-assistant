name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.9-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "AI求职悬浮助手 v1.0.9 (深度对齐 Google Stitch 高保真 Bento 规范与交互落地)"
          body: |
            AI 求职悬浮助手 v1.0.9 重磅版本发布：全面落地 Google Stitch 极高保真交互与视觉体系！
            1. 顶栏全新 Mascot Header：PRO 徽章微标与圆角方形好运猫头像容器，右侧配有服务待命双色呼吸灯及快速设置跳转入口；
            2. 沉浸式渐变 Master 悬浮看板：三色平滑渐变底色，微光自适配状态芯片，原生级平滑轻量开关，新增【试运行模拟弹窗】与【调整猫咪浮标大小】快捷操作胶囊；
            3. 核心权限与战绩看板联动：已授权双状态芯片，3 列高保真战绩数据流（今日识别、高回复率、平均响应）及最近破冰成功战报胶囊；
            4. 2x2 Bento 大模型引擎矩阵：涵盖 deepseek-flash、deepseek-r1 (深度思考)、deepseek-chat、qwen-turbo，点击即时切换持久化，高亮激活态；
            5. 高保真实战技巧与操作指引：温暖渐变底板 + 编号圆球，指引求职者高响应率直达 HR；
            6. 全新交互式模拟破冰弹窗：无需切换应用即可在 App 内即时预览浮标对话、话术智能定制及一键换一句。
          files: release_apk/JobAssistant-v1.0.9-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

