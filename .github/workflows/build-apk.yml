name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 验证岗位匹配并编译 APK
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.4.4.apk

      - name: 校验 APK 版本与签名
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release_apk/JobAssistant-v1.4.4.apk
          "$BUILD_TOOLS/aapt" dump badging release_apk/JobAssistant-v1.4.4.apk > apk-badging.txt
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('version.json').read_text())
          gradle = pathlib.Path('app/build.gradle.kts').read_text()
          badging = pathlib.Path('apk-badging.txt').read_text()
          assert re.search(r'versionCode\s*=\s*' + str(version['versionCode']) + r'\b', gradle)
          assert 'versionName = "' + version['versionName'] + '"' in gradle
          assert "name='com.assistant.job'" in badging
          assert "versionCode='" + str(version['versionCode']) + "'" in badging
          assert "versionName='" + version['versionName'] + "'" in badging
          print(badging.splitlines()[0])
          PY
          cd release_apk
          sha256sum JobAssistant-v1.4.4.apk > SHA256SUMS.txt

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*
          retention-days: 30

      - name: 保存单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.4
          target_commitish: ${{ github.sha }}
          name: "AI求职助手 v1.4.4 · 修复生成正文读取超时"
          body: |
            修复收到 HTTP 200 后仍在等待模型正文、触发旧版 45 秒读取超时的问题。

            - 两阶段生成改为流式读取，接收保活与增量回答，保留模型原有思考设置。
            - 生成请求连续无数据超时 120 秒，每阶段总时限 5 分钟；支持取消，不自动重试生成。
            - 流中断、输出截断或未正常结束时停止，不使用不完整匹配结果；兼容返回普通 JSON 的接口。
            - 可复制报告新增已收字节、回答/思考字符数、首批正文等待、最后收包时间与流结束状态；不保存思考原文。
            - 保留完整 JD 与简历逐项对照、覆盖和引用校验；沿用原签名，可覆盖安装。

            已验证模拟服务端延迟 46 秒返回正文、保活、断流、超时与取消场景；实际手机网络和服务端耗时仍取决于运行环境。
          files: release_apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
