name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.7-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "AI求职悬浮助手 v1.0.7 (悬浮窗岗位JD识别预览与手动修改/剪贴板覆盖)"
          body: |
            🎉 **AI 求职悬浮助手 v1.0.7 更新日志**：
            1. 🔍 **新增【岗位 JD 识别状态与字数徽章】**：点击悬浮球后，在弹窗顶部直接展示已识别到的字数与状态（如「✓ 识别成功 · 258 字」）；
            2. 📋 **新增【JD 实时预览与单行折叠摘要】**：默认展示已读屏文本摘要，可随时点击【校对/修改 ▾】展开完整文本进行核验；
            3. ✏️ **新增【多行手动编辑与剪贴板一键覆盖】**：若屏幕自动识别有遗漏或不准，支持长按修改，或一键点击【📋 粘贴剪贴板】快速替换；
            4. 🚀 **新增【按新 JD 重新生成】闭环**：修改或粘贴完成后，点击【🚀 按此JD重新生成】，即刻调用 AI 重算并输出高匹配度定制打招呼语；
            5. 🛡️ **体验优化**：优化 WindowManager 软键盘弹起自适应（`SOFT_INPUT_ADJUST_RESIZE`），并增加异步生成任务防重取消控制。
          files: release_apk/JobAssistant-v1.0.7-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

