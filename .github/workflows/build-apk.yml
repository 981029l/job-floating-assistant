name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.3.1.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.1
          name: "AI求职悬浮助手 v1.3.1 (彻底根除检查更新403/全球CDN与302探针/纯净正式版APK)"
          body: |
            AI 求职悬浮助手 v1.3.1 极速稳定升级：
            1. 彻底解决检查更新报 403 错误（GitHub API 频控熔断）：
               - 通道一（首选）：基于 jsDelivr 全球免费 CDN 极速探测 version.json，永久零频控，延迟 < 50ms；
               - 通道二（备选）：轻量网页 302 重定向 Location 探针，无 REST API 频控限制；
               - 通道三（兜底）：官方 GitHub REST API。
            2. 职位特征与 JD 记忆池：
               - 在 BOSS 浏览岗位时自动提取职位名、公司名与完整任职要求入池；
               - 聊天页自动秒级关联命中对应完整长 JD，彻底攻克聊天页无 JD 问题。
            3. 主应用独立 Tab 2【岗位针对性模拟面试 · 考点预测押题】完整就绪；
            4. 正式发布包全面去除「-debug」后缀（JobAssistant-v1.3.1.apk），继承固化密钥，一键覆盖安装数据完全保留。
          files: release_apk/JobAssistant-v1.3.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

