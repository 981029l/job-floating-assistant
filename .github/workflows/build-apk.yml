name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.6-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.6
          name: "AI求职悬浮助手 v1.1.6 (固定全局签名/支持直接覆盖安装更新)"
          body: |
            AI 求职悬浮助手 v1.1.6 核心工程体验突破：
            1. 彻底解决每次更新需卸载旧 App 的痛点：
               - 仓库内置永久持久化签名密钥库（debug.keystore），使每次 GitHub Actions 云端编译出的 APK 均拥有完全一致的数字加密公钥与 SHA-256 指纹；
               - 完美通过 Android 系统的 PackageManager 覆盖签名校验；
               - 今后每一次升级只需直接点击「覆盖安装 / 更新」，本地保存的 API Key、自定义提示词、简历档案数据与设置 100% 完整保留，告别手动卸载。
            2. 包含 v1.1.5 的全部底栏动效与交互优化：
               - 底部导航栏平滑横滑动效（Material Design 3 Shared Axis X 规范）；
               - 简历档案纯净空白录入引导态；
               - 模型卡片高亮选中态；
               - 顶部 Header 药丸排版防挤压展示。
          files: release_apk/JobAssistant-v1.1.6-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

