name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.2.5-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.5
          name: "AI求职悬浮助手 v1.2.5 (全链路5档覆盖/投后跟进/深入沟通/已读未回/未读唤醒/首次破冰)"
          body: |
            AI 求职悬浮助手 v1.1.7 全盘去伪存真与体验升级：
            1. 彻底拔除所有虚假数据：
               - 设置页连通性卡片真实联动：未填写 API Key 时明确显示「离线状态 · 0 个可用模型」，严禁无 Key 伪造「连通性极佳 · Ping 88ms」；填写后真实发起网络测速，显示实际延迟与真实拉取的模型数量；
               - 悬浮主控看板去伪：今日识别为 0 次时，战绩指标真实显示「--% / -- s」，移除写死的虚假 100% 和 0.6s；
               - 设置页模拟打招呼弹窗去伪：彻底移除写死的 3 条假前端话术，接入大模型真实在线推理生成。
            2. 彻底整修「AI 精炼优势」卡片 UI 与功能：
               - 视觉排版重构：消除背景色彩与边框冲突，对齐统一设计规范；
               - 真实 AI 一键生成：新增「AI 一键从简历提炼」功能，真实调用大模型提炼个人核心亮点，拒绝假 AI；
               - 编辑模式布局规范化：取消与保存按钮统一底置，交互自然流畅。
            3. 顶部 Header 药丸排版防挤压与真实版本绑定：
               - 彻底解决版本胶囊被挤压截断为「• P」的严重排版 Bug，真实绑定当前应用版本号 v1.1.7；
            4. 继承持久化 debug.keystore 签名：
               - 本次及后续所有版本均支持直接覆盖更新安装，数据完全保留。
          files: release_apk/JobAssistant-v1.2.5-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

