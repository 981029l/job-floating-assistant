name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.2.9.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.9
          name: "AI求职悬浮助手 v1.2.9 (新增岗位全真模拟面试押题专区/纯净正式版APK)"
          body: |
            AI 求职悬浮助手 v1.2.9 全新重磅升级：
            1. 全新上线【岗位针对性模拟面试 · 考点预测押题】（主应用独立 Tab 2）：
               - 深度穿透 4 维考题矩阵：技术深水区原理、项目经历真实性深挖、架构场景设计、HR 与综合沟通；
               - 智能关联：一键同步无障碍服务抓取的当前岗位真实 JD，自动结合候选人简历真实经历；
               - 专业解析：每道题目附带【考官核心意图与考核陷阱】+【STAR 法则满分回答思路】+【大厂面试避坑红线】；
               - 支持全考点分类筛选过滤与一键复制考题解析。
            2. 正式安装包全面去除「-debug」后缀：
               - 产物全面正规化，规范命名为 JobAssistant-v1.2.9.apk；
               - 继承统一固化密钥签名，已安装的老板/用户可直接一键无缝覆盖更新，数据 100% 完整保留。
          files: release_apk/JobAssistant-v1.2.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

