name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.0-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "AI求职悬浮助手 v1.1.0 (求职档案全盘对齐 Google Stitch 高保真规范)"
          body: |
            AI 求职悬浮助手 v1.1.0 重磅发布：求职档案库全盘落地 Google Stitch 高保真设计体系！
            1. 简历绑定状态卡片：文档图标容器、已绑定/未绑定状态标签、PDF/Word智能解析标识、脱敏隐私安全徽章及快捷更换与全宽上传按钮；
            2. 简历核心提取亮点胶囊：职龄背景标签（7年前端、全日制本科科班、带团队架构）、核心技术栈（Vue3、大模型SSE、Canvas等）、AI重提按钮及【+ 加亮点】自定义弹层；
            3. 结构化知识依据库：期望职位与坐标卡片、核心工作经历（支持查看与原位编辑保存、经历一键复制到剪贴板）、过往工作经历、AI精炼即用语料调整卡片；
            4. 恢复预设与一键重置：支持一键还原系统高分匹配模板；
            5. 完整全局简历文本持久化：底部保留全量简历正文编辑器，编辑自动同步大模型上下文。
          files: release_apk/JobAssistant-v1.1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

