name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.3.0.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "AI求职悬浮助手 v1.3.0 (职位特征与JD记忆池/聊天界面智能命中/纯净正式版APK)"
          body: |
            AI 求职悬浮助手 v1.3.0 跨代重磅升级：
            1. 全新上线【职位特征与 JD 记忆池】（彻底攻克聊天页无 JD 行业顽疾）：
               - 详情页无感建池：在 BOSS 浏览岗位时自动提取职位名、公司名与完整任职要求，建立 50 条高速记忆池；
               - 聊天页秒级命中：从消息列表直接进入聊天时，根据顶部卡片特征自动命中对应完整长 JD；
               - 智能降级兜底：未建池的全新沟通直接提取顶栏职位与薪资特征，结合最新聊天与简历生成高情商推进话术。
            2. 主应用独立 Tab 2【岗位针对性模拟面试 · 考点预测押题】完整上线：
               - 4 维考题深度穿透：技术深水区原理、项目经历真实性深挖、架构场景设计、HR 与综合沟通；
               - 每道题附带【考官考察意图】+【STAR 法则满分回答逻辑】+【大厂避坑红线】。
            3. 正式发布包全面去除「-debug」后缀：
               - 产物规范命名为 JobAssistant-v1.3.0.apk；
               - 继承统一固化密钥签名，已安装的老板/用户可直接一键无缝覆盖更新，数据 100% 完整保留。
          files: release_apk/JobAssistant-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

