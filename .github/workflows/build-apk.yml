name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.0.6-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "AI求职悬浮助手 v1.0.6 (全套高保真概念图实现版)"
          body: |
            🎉 **AI 求职悬浮助手 v1.0.6 正式发布**：
            1. 📱 **页面 1【悬浮主控 Dashboard】**：Bento 触控大开关、C1招手好运猫顶栏呼吸光效、核心权限自检与模型快捷切换；
            2. 📄 **页面 2【求职档案 Profile】**：紫色高光简历上传卡片，支持 PDF/Word 文件解析导入与结构化技能标签呈现；
            3. ⚙️ **页面 3【AI智囊设置 Settings】**：API Key 密文管理、Base URL 配置、联网获取可用模型列表与自定义 Prompt 规则；
            4. ⚡ **页面 4【BOSS悬浮实测 Floating Overlay】**：C1 招手好运猫全局圆形浮标，带【技术硬核攻坚型】与【全面契合交流型】双卡片一键复制闭环。
          files: release_apk/JobAssistant-v1.0.6-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

