name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.4.1.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.1
          name: "AI求职助手 v1.4.1 (JD双轨判定/轻装上阵/Few-Shot正反范例/解除自定义拦截)"
          body: |
            AI 求职助手 v1.4.1 重大更新说明：
            1. 彻底终结法典补丁地狱：拔除过载的微观数字枷锁（字数/逗号数/权重），轻装上阵释放模型语义推理 Attention；
            2. JD 属性双轨判定：区分具象业务型 JD 与通用架构型 JD，彻底根治通用岗位反客为主强推 AI 知识库的自嗨 Bug；
            3. 真实场景 Few-Shot 正反少样本驱动：内置真实岗位正反案例对照示范，语义对齐率大幅跃升；
            4. 解除自定义提示词静默拦截：修复旧版硬编码判定导致自定义 Prompt 被强制回退的底层缺陷，增强非 AI 岗位物理防护安全网；
            5. 正式产物 APK 名：JobAssistant-v1.4.1.apk（继承持久签名，无缝覆盖升级）。
          files: release_apk/JobAssistant-v1.4.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
