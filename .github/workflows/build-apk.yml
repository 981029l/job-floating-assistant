name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.4-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4
          name: "AI求职悬浮助手 v1.1.4 (彻底清理写死档案/去除当前徽章/修复胶囊排版)"
          body: |
            AI 求职悬浮助手 v1.1.4 细节精修与全盘去污发布：
            1. 彻底清除写死假档案：
               - 清除所有前端 7 年经验、深讯科技、爱球直播等硬编码默认数据；
               - 真实落地规范的 Empty State 空状态引导（支持未录入状态下的点击编辑与上传简历同步）；
               - 依据库支持一键「清空档案」；
            2. 模型卡片交互体验去污：
               - 彻底移除生硬深蓝色的「当前」文本徽章，保持业务属性标签（如「深度思考」），以优雅的高亮主色边框与轻量对勾传达选中态；
            3. 顶部 Header 药丸排版防挤压：
               - 彻底修复「服 务 待 命 中」被挤压为竖条胶囊的排版缺陷，保证任何机型分辨率下永远横向单行展示；
            4. 虚假战绩数据归零：
               - 主控看板初始展示真实「今日识别 0 次 / 待触发破冰」状态；
            5. 校准底部主控图标：
               - 采用正视对称的端正控制台 Bento 图标（ic_dashboard.xml）。
          files: release_apk/JobAssistant-v1.1.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

