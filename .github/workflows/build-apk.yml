name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译打包 (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/JobAssistant-v1.1.3-debug.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Debug-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "AI求职悬浮助手 v1.1.3 (长篇岗位JD静默去重增量合并与屏幕追加)"
          body: |
            AI 求职悬浮助手 v1.1.3 重磅升级：长篇岗位 JD 静默去重增量合并方案 A 正式落地！
            1. 静默去重合并引擎：
               - 在 BOSS 直聘等平台上下滑动长职位详情页时，自动监听滑动事件（TYPE_VIEW_SCROLLED）；
               - 通过 LinkedHashSet 动态保持文本先后顺序，基于行级去重自动将首屏、次屏重叠内容无缝剔除并增量追加末尾新段落；
               - 页面切换（跳出或进新岗位）时自动清空历史缓冲区，杜绝跨岗位内容污染；
            2. 悬浮窗长 JD 状态透传与追加按钮：
               - 识别状态徽章联动识别结果：已识别多屏内容时标明「已智能合并长JD · X字」；
               - 悬浮窗校对区新增「追加屏幕」快捷操作，支持随时追加捕获最新滚屏文本；
            3. 全工程 0 Emojis，保持超轻量安装包设计 (~17MB)。
          files: release_apk/JobAssistant-v1.1.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

