name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自动化配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 赋予 gradlew 执行权限
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 执行编译 (assembleRelease)
        run: gradle assembleRelease --stacktrace

      - name: 重命名 APK 文件
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/JobAssistant-v1.4.0.apk

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobAssistant-Release-APK
          path: release_apk/*.apk
          retention-days: 30

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "AI求职助手 v1.4.0 (四大新法典落地/封杀软素质/基石语言升维/双微型分句呼吸感)"
          body: |
            AI 求职助手 v1.4.0 重大更新说明：
            1. 落地四大新法典（grill-me 深度压力拷问通过）：全场景封杀软素质与管理职责，首条破冰 100% 聚焦硬核业务与技术交付；
            2. 基石语言升维压制法则：现代主流框架优先，具备 Vue3/React/TS 时彻底剔除倒退罗列 HTML/CSS/JS 常识语言；
            3. 抽象极简 JD 物理形态具象化与收尾去套话：提炼企业级系统形态融合主语，收尾严禁空泛自嗨“方向契合”，收窄为实战交付契合；
            4. 第二句双微型分句呼吸感法则：全句严控 32-42 字与最多 2 个逗号，[技术栈+项目] 紧接 [攻坚/从属加分]，彻底消灭窒息大长句；
            5. 正式产物 APK 名：JobAssistant-v1.4.0.apk（继承持久签名，无缝覆盖升级）。
          files: release_apk/JobAssistant-v1.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动刷新 jsDelivr 全球 CDN 缓存
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Purging jsDelivr CDN cache for version.json..."
          curl -s https://purge.jsdelivr.net/gh/981029l/job-floating-assistant@main/version.json || true
